[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
datastorePreferences = "1.3.0"
playServicesAds = "25.5.0"
ump = "4.0.0"
junit = "4.13.2"
junitVersion = "1.3.0"
runner = "1.7.0"
core = "1.7.0"
robolectric = "4.17"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
